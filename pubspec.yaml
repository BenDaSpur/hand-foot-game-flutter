name: hand_foot_game_flutter
description: "A beautiful Hand & Foot card game with Balatro-inspired visuals and intelligent AI opponents."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  logging: ^1.3.0
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.1
  firebase_analytics: ^12.0.0
  device_info_plus: ^11.5.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.5
  # LLM dependencies
  # tflite_flutter: ^0.11.0 # Removed - using intelligent fallback instead

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/phi3-mini-4k-instruct-cpu-int4-rtn-block-32-acc-level-4.onnx

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  min_sdk_android: 21 # Android minimum SDK version
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#1a1625"
    theme_color: "#8b5cf6"
  windows:
    generate: true
    image_path: "logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "logo.png"
