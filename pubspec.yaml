name: hand_foot_game_flutter
description: "A beautiful Hand & Foot card game with Balatro-inspired visuals and intelligent AI opponents."
publish_to: "none"
version: 2026.10.22+2
homepage: https://playhandfoot.com
repository: https://github.com/BenDaSpur/hand-foot-game-flutter # pragma: allowlist secret
issue_tracker: https://github.com/BenDaSpur/hand-foot-game-flutter/issues # pragma: allowlist secret

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.6
  logging: ^1.3.0
  # firebase_auth 6.7.0 calls migrateCurrentUser; that named arg is
  # only on firebase_auth_platform_interface 9.1.0+ (Dependabot left 9.0.7).
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_auth_platform_interface: ^9.1.0
  firebase_analytics: ^12.6.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  uuid: ^4.5.3
  connectivity_plus: ^7.3.2
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.4.3
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3
  web: ^1.1.1
  google_mobile_ads: ^9.1.0
  material_ui: ^1.7.0
  cupertino_ui: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # CocoaPods: Flutter SPM cannot resolve firebase-ios-sdk required by
  # the pinned firebase_core; keep SPM disabled for iOS builds.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  image_path_ios: "logo_ios.png"
  remove_alpha_ios: true
  min_sdk_android: 21 # Android minimum SDK version
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#1a1625"
    theme_color: "#8b5cf6"
  windows:
    generate: true
    image_path: "logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "logo.png"
