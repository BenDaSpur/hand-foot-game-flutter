name: hand_foot_game_flutter
description: "A beautiful Hand & Foot card game with Balatro-inspired visuals and intelligent AI opponents."
publish_to: "none"
version: 1.0.2+4
homepage: https://playhandfoot.com
repository: https://github.com/BenDaSpur/hand-foot-game-flutter # pragma: allowlist secret
issue_tracker: https://github.com/BenDaSpur/hand-foot-game-flutter/issues # pragma: allowlist secret

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  logging: ^1.3.0
  # Pin below broken FlutterFire 6.7/6.5.5/12.4.4 releases that extend
  # `FirebasePlugin` before firebase_core_platform_interface publishes it.
  firebase_core: ">=4.11.0 <4.12.0"
  cloud_firestore: ">=6.6.0 <6.7.0"
  firebase_auth: ">=6.5.4 <6.5.5"
  firebase_analytics: ">=12.4.3 <12.4.4"
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  uuid: ^4.5.3
  connectivity_plus: ^7.2.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.3.2
  audioplayers: ^6.8.1
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # CocoaPods: Flutter 3.44 SPM cannot resolve firebase-ios-sdk 12.15.0
  # required by the pinned firebase_core 4.11.0.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  image_path_ios: "logo_ios.png"
  remove_alpha_ios: true
  min_sdk_android: 21 # Android minimum SDK version
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#1a1625"
    theme_color: "#8b5cf6"
  windows:
    generate: true
    image_path: "logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "logo.png"
