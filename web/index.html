<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hand_foot_game_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hand & Foot Card Game</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- ONNX Runtime Web for Phi-3 inference -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js" 
          crossorigin="anonymous"></script>
  
  <!-- Transformers.js for proper Phi-3 tokenization -->
  <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js" 
          crossorigin="anonymous"></script>
  
  <script>
    // Configure ONNX Runtime for optimal Phi-3 performance
    window.addEventListener('DOMContentLoaded', async function() {
      try {
        if (typeof ort !== 'undefined') {
          // Configure for WebGPU + WASM fallback
          ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/';
          ort.env.wasm.numThreads = 4; // Increased for better performance
          ort.env.logLevel = 'warning';
          
          // Enable WebGPU for Phi-3 acceleration
          ort.env.webgpu.validateInputContent = false; // Improve performance
          
          console.log('ONNX Runtime Web 1.17.0 initialized with WebGPU support');
          
          // Make ONNX available globally for Flutter
          window.onnxRuntime = ort;
          
          // Initialize transformers.js for tokenization
          if (typeof pipeline !== 'undefined') {
            window.transformers = { pipeline, AutoTokenizer: transformers.AutoTokenizer };
            console.log('Transformers.js initialized for Phi-3 tokenization');
          }
        } else {
          throw new Error('ONNX Runtime failed to load');
        }
      } catch (error) {
        console.error('Critical LLM initialization failure:', error);
        // No fallback - fail hard if LLM cannot be initialized
        window.onnxRuntime = null;
        window.transformers = null;
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
