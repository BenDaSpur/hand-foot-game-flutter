<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play the classic Hand and Foot card game against AI opponents or friends online. Works offline!"
    />
    <meta
      name="keywords"
      content="hand and foot, card game, rummy, canasta, multiplayer, offline game"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Hand & Foot" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#8b5cf6" />

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8788020871095245"
      crossorigin="anonymous"
    ></script>

    <title>Hand & Foot Card Game</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="privacy-policy" href="/privacy.html" />

    <!-- Prevent mobile browser long-press menus (Find in Page, text selection) -->
    <style>
      html,
      body,
      flt-glass-pane,
      flt-scene-host,
      canvas {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* Keep native text entry usable in multiplayer lobby / dialogs */
      input,
      textarea,
      [contenteditable="true"] {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
    </style>

    <!-- Preload critical resources -->
    <link rel="preload" href="flutter_bootstrap.js" as="script" />
  </head>
  <body>
    <!-- Loading indicator while Flutter initializes -->
    <div
      id="loading"
      style="
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #1a1625 0%, #2d1f47 100%);
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
      "
    >
      <div style="font-size: 48px; margin-bottom: 20px">🃏</div>
      <div style="font-size: 24px; font-weight: bold">Hand & Foot</div>
      <div style="font-size: 14px; margin-top: 10px; opacity: 0.7">
        Loading...
      </div>
    </div>

    <script>
      // Block browser long-press / right-click menus during gameplay.
      // Allow text selection only in real form fields (multiplayer lobby).
      function isEditableTarget(target) {
        if (!target || !target.tagName) {
          return false;
        }
        const tag = target.tagName.toLowerCase();
        return (
          tag === "input" ||
          tag === "textarea" ||
          target.isContentEditable
        );
      }

      document.addEventListener(
        "contextmenu",
        function (event) {
          if (!isEditableTarget(event.target)) {
            event.preventDefault();
          }
        },
        { passive: false }
      );

      document.addEventListener(
        "selectstart",
        function (event) {
          if (!isEditableTarget(event.target)) {
            event.preventDefault();
          }
        },
        { passive: false }
      );

      // Hide loading screen when Flutter is ready
      window.addEventListener("flutter-first-frame", function () {
        const loading = document.getElementById("loading");
        if (loading) {
          loading.style.display = "none";
        }
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
