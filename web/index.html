<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hand_foot_game_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hand & Foot Card Game</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- ONNX.js for web-based LLM inference -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>
  
  <script>
    // Configure ONNX Runtime for optimal performance
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof ort !== 'undefined') {
        // Configure ONNX Runtime execution providers
        ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/';
        ort.env.wasm.numThreads = 2; // Limit threads for stability
        ort.env.logLevel = 'error'; // Reduce logging
        
        console.log('ONNX Runtime for Web initialized');
        
        // Make ONNX available globally for Flutter
        window.onnxRuntime = ort;
      } else {
        console.warn('ONNX Runtime failed to load - LLM will use fallback');
        window.onnxRuntime = null;
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
