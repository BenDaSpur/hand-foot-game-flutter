name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Android build
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Setup Android NDK
        run: |
          echo "Installing Android NDK 27.0.12077973"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Create Firebase config (Android)
        run: |
          if [[ -n "${{ secrets.FIREBASE_CONFIG_ANDROID }}" ]]; then
            echo "Using production Firebase Android configuration"
            echo "${{ secrets.FIREBASE_CONFIG_ANDROID }}" | base64 -d > android/app/google-services.json
          else
            echo "Creating stub Android Firebase config"
            echo '{"project_info":{"project_number":"000000000000","project_id":"stub-project"}}' > android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Firebase config (Web)
        run: |
          if [[ -n "${{ secrets.FIREBASE_WEB_CONFIG }}" ]]; then
            echo "Using production Firebase web configuration"
            echo "${{ secrets.FIREBASE_WEB_CONFIG }}" | base64 -d > lib/firebase_options.dart
          else
            echo "FIREBASE_WEB_CONFIG not found, using stub configuration"
            # App will use the default stub configuration in firebase_options.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /handfoot/

      - name: Create web archive
        run: |
          cd build/web
          tar -czf ../../hand-foot-web.tar.gz *

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: hand-foot-web.tar.gz

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }}
            %APPDATA%\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Firebase config (Windows)
        run: |
          $config = "${{ secrets.FIREBASE_WEB_CONFIG }}"
          if ($config) {
            Write-Output "Using production Firebase web configuration"
            [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($config)) | Out-File -FilePath "lib/firebase_options.dart" -Encoding UTF8
          } else {
            Write-Output "FIREBASE_WEB_CONFIG not found, using stub configuration"
            # App will use the default stub configuration in firebase_options.dart
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Windows archive
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath hand-foot-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: hand-foot-windows.zip

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            macos/Pods
            ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache Xcode build
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.xcode_cache
          key: ${{ runner.os }}-xcode-${{ hashFiles('macos/**/*.pbxproj', 'macos/**/*.xcconfig') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Setup Firebase configs (macOS/iOS)
        run: |
          # Decode iOS Firebase config for both iOS and macOS
          echo "${{ secrets.FIREBASE_CONFIG_IOS }}" | base64 -d > ios/Runner/GoogleService-Info.plist
          echo "${{ secrets.FIREBASE_CONFIG_IOS }}" | base64 -d > macos/Runner/GoogleService-Info.plist

          # Web Firebase config  
          if [[ -n "${{ secrets.FIREBASE_WEB_CONFIG }}" ]]; then
            echo "Using production Firebase web configuration"
            echo "${{ secrets.FIREBASE_WEB_CONFIG }}" | base64 -d > lib/firebase_options.dart
          else
            echo "FIREBASE_WEB_CONFIG not found, using stub configuration"
            # App will use the default stub configuration in firebase_options.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS archive
        run: |
          cd build/macos/Build/Products/Release
          tar -czf ../../../../../hand-foot-macos.tar.gz hand_foot_game_flutter.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: hand-foot-macos.tar.gz

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Linux dependencies
        uses: actions/cache@v3
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build-and-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Firebase config (Linux)
        run: |
          if [[ -n "${{ secrets.FIREBASE_WEB_CONFIG }}" ]]; then
            echo "Using production Firebase web configuration"
            echo "${{ secrets.FIREBASE_WEB_CONFIG }}" | base64 -d > lib/firebase_options.dart
          else
            echo "FIREBASE_WEB_CONFIG not found, using stub configuration"
            # App will use the default stub configuration in firebase_options.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux archive
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../hand-foot-linux.tar.gz *

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: hand-foot-linux.tar.gz

  create-release:
    needs: [build-android, build-web, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history and tags

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog with Claude
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          CURRENT_TAG=${{ steps.version.outputs.VERSION }}

          # If this is the first tag, compare against first commit
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          # Get commit messages with more detail and better error handling
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Generating changelog from $PREV_TAG to HEAD (workflow dispatch)"
            COMMITS=$(git log --pretty=format:"%s|%b" $PREV_TAG..HEAD 2>/dev/null | sed '/^$/d' || echo "")
          else
            echo "Generating changelog from $PREV_TAG to $CURRENT_TAG (tag push)"
            COMMITS=$(git log --pretty=format:"%s|%b" $PREV_TAG..$CURRENT_TAG 2>/dev/null | sed '/^$/d' || echo "")
          fi

          echo "Found commits: ${#COMMITS} characters"
          echo "Commits preview: ${COMMITS:0:200}..."

          # If no commits or git log failed, use a simple message
          if [ -z "$COMMITS" ] || [ "$COMMITS" = "" ]; then
            echo "No commits found - generating simple changelog"
            echo "## 🔄 Changes Since Last Release" > changelog.md
            echo "" >> changelog.md
            echo "- No changes since last release" >> changelog.md
          else
            # Use Claude to generate a better changelog
            echo "Generating changelog with Claude..."
            
            # Prepare the prompt
            PROMPT="You are generating release notes for a Flutter card game app called Hand & Foot. Given these git commits, create a clean changelog with categories like Features, Bug Fixes, Improvements. Use emoji and be concise.

          Commits:
          $COMMITS

          Generate markdown starting with: ## 🔄 Changes Since Last Release"
            
            # Call Claude API with timeout and better error handling
            HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json --max-time 60 \
              https://api.anthropic.com/v1/messages \
              -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "{
                \"model\": \"claude-3-5-haiku-latest\",
                \"max_tokens\": 1000,
                \"messages\": [{
                  \"role\": \"user\",
                  \"content\": $(echo "$PROMPT" | jq -Rs . || echo '\"Failed to encode prompt\"')
                }]
              }" || echo "000")
            
            echo "Claude API HTTP response code: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              # Extract the content from Claude's response
              CHANGELOG=$(jq -r '.content[0].text // "## 🔄 Changes Since Last Release\n\n- Failed to parse Claude response"' response.json)
              echo "$CHANGELOG" > changelog.md
              echo "Claude changelog generated successfully"
            else
              echo "Claude API call failed with HTTP $HTTP_CODE"
              cat response.json || true
              # Clean up response file
              rm -f response.json
              # Fallback to simple changelog
              echo "## 🔄 Changes Since Last Release" > changelog.md
              echo "" >> changelog.md
              echo "$COMMITS" >> changelog.md
            fi
            
            # Final cleanup
            rm -f response.json
          fi

          # Create complete release notes file
          cat > release_notes.md << 'EOF'
          ## 🎮 Hand & Foot Card Game Release ${{ steps.version.outputs.VERSION }}

          A beautiful Flutter implementation of the classic Hand & Foot card game with Balatro-inspired visuals!

          EOF

          # Add changelog content
          cat changelog.md >> release_notes.md

          # Add the rest of the release notes
          cat >> release_notes.md << 'EOF'

          ### 📱 Downloads

          - **Android**: Download the APK file below for Android devices
          - **Windows**: Download and extract the Windows ZIP file
          - **macOS**: Download and extract the macOS archive
          - **Linux**: Download and extract the Linux archive  
          - **Web**: Host the web archive on any web server
          - **🌐 Play Online**: [GitHub Pages](https://bendaspur.github.io/hand-foot-game-flutter/)

          ### 🎯 Game Features
          - Smart AI opponents with strategic gameplay
          - Stunning neon Balatro-inspired theme
          - Complete Hand & Foot rules implementation
          - Multi-round progression with increasing difficulty

          ### 🚀 Installation
          - **Android**: Enable "Install from unknown sources" and install the APK
          - **Desktop**: Extract the archive and run the executable
          - **Web**: Extract and serve the files from a web server

          Enjoy the game! 🃏✨
          EOF

      - name: Rename artifacts with version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Rename artifacts to include version (name-platform-version format)
          mv android-apk/app-release.apk android-apk/HandFoot-Android-${VERSION}.apk
          mv android-aab/app-release.aab android-aab/HandFoot-Android-${VERSION}.aab
          mv windows-build/hand-foot-windows.zip windows-build/HandFoot-Windows-${VERSION}.zip
          mv macos-build/hand-foot-macos.tar.gz macos-build/HandFoot-macOS-${VERSION}.tar.gz
          mv linux-build/hand-foot-linux.tar.gz linux-build/HandFoot-Linux-${VERSION}.tar.gz
          mv web-build/hand-foot-web.tar.gz web-build/HandFoot-Web-${VERSION}.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Hand & Foot Game ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            android-apk/HandFoot-Android-${{ steps.version.outputs.VERSION }}.apk
            android-aab/HandFoot-Android-${{ steps.version.outputs.VERSION }}.aab
            windows-build/HandFoot-Windows-${{ steps.version.outputs.VERSION }}.zip
            macos-build/HandFoot-macOS-${{ steps.version.outputs.VERSION }}.tar.gz
            linux-build/HandFoot-Linux-${{ steps.version.outputs.VERSION }}.tar.gz
            web-build/HandFoot-Web-${{ steps.version.outputs.VERSION }}.tar.gz
