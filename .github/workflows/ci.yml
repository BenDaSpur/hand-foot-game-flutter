name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  ci-checks:
    uses: ./.github/workflows/shared-quality-checks.yml
    with:
      setup_firebase_android: true
      run_e2e_tests: true
      flutter_version: "3.32.8"
    secrets: inherit
