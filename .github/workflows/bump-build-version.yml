name: Bump Build Version

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-build-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.head_commit.message, 'chore: bump build version') &&
        !contains(github.event.head_commit.message, 'chore/bump-build-version') &&
        github.event.head_commit.author.name != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Bump pubspec version
        id: bump
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NEW_VERSION=$(dart run scripts/bump_build_version.dart pubspec.yaml)
          else
            NEW_VERSION=""
            while IFS= read -r version_date; do
              if [ -z "$version_date" ]; then
                continue
              fi
              NEW_VERSION=$(dart run scripts/bump_build_version.dart pubspec.yaml "$version_date")
            done < <(bash scripts/pending_version_bump_dates.sh)
          fi

          if git diff --quiet -- pubspec.yaml; then
            echo "No pending version bump"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add pubspec.yaml
          git commit -m "chore: bump build version to ${NEW_VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push version bump
        if: steps.bump.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.bump.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BUMP_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          # Git over HTTPS authenticates with Basic auth (x-access-token),
          # not a Bearer extraheader. Bearer is ignored, then git prompts
          # for a username and fails in CI with "No such device or address".
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bump_branch="chore/bump-build-version"

          if [ -n "${VERSION_BUMP_TOKEN:-}" ]; then
            echo "Pushing ${VERSION} to ${BRANCH} with VERSION_BUMP_TOKEN"
            git push \
              "https://x-access-token:${VERSION_BUMP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${BRANCH}"
            exit 0
          fi

          if git push "${remote_url}" "HEAD:${BRANCH}"; then
            echo "Pushed ${VERSION} to ${BRANCH}"
            exit 0
          fi

          echo "Direct push to ${BRANCH} was rejected; opening a pull request"
          git push --force "${remote_url}" "HEAD:refs/heads/${bump_branch}"

          pr_title="chore: bump build version to ${VERSION}"
          pr_body="Automated calendar build version bump to \`${VERSION}\`.

          This PR only changes \`pubspec.yaml\`. It is opened because \`${BRANCH}\` requires pull requests and status checks, and the default \`GITHUB_TOKEN\` cannot push through that protection.

          Auto-merge is enabled so the bump lands after required checks pass (and after any required review)."

          pr_state="$(gh pr view "${bump_branch}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state 2>/dev/null || true)"
          if [ "${pr_state}" = "OPEN" ]; then
            gh pr edit "${bump_branch}" --repo "${GITHUB_REPOSITORY}" --title "${pr_title}" --body "${pr_body}"
          elif ! gh pr create --repo "${GITHUB_REPOSITORY}" --base "${BRANCH}" --head "${bump_branch}" --title "${pr_title}" --body "${pr_body}"; then
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${BRANCH}...${bump_branch}?expand=1"
            echo "::warning::Pushed ${VERSION} to ${bump_branch} but GitHub Actions is not permitted to create pull requests. Enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests, or open ${compare_url}"
            echo "Bump branch is ready: ${compare_url}"
            exit 0
          fi

          if gh pr merge "${bump_branch}" --repo "${GITHUB_REPOSITORY}" --squash --auto --delete-branch \
            --subject "${pr_title}" --body ""; then
            echo "Auto-merge enabled for ${pr_title}"
          else
            echo "Could not enable auto-merge; the pull request is open for review"
          fi
