name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Test and validate (runs on all events)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze

  # Build job (only on PRs for validation)
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Create Firebase config
        run: |
          # Create firebase_options.dart from secrets
          echo "${{ secrets.FIREBASE_WEB_CONFIG }}" | base64 -d > lib/firebase_options.dart
          
          # Replace the helper class with proper import
          sed -i 's/class _FirebaseOptionsHelper {/\/\/ Replaced by CI\/CD - import firebase options/' lib/services/firebase_service.dart
          sed -i 's/static FirebaseOptions? get currentPlatform {/\/\/ Import DefaultFirebaseOptions from firebase_options.dart/' lib/services/firebase_service.dart
          sed -i 's/return null;/\/\/ Using DefaultFirebaseOptions.currentPlatform/' lib/services/firebase_service.dart
          sed -i 's/_FirebaseOptionsHelper.currentPlatform/DefaultFirebaseOptions.currentPlatform/' lib/services/firebase_service.dart
          
          # Add the proper import
          sed -i '12a import '\''../firebase_options.dart'\'';' lib/services/firebase_service.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (validation only)
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

  # Deployment job (reusing working steps from build-and-release.yml)
  deploy-pages:
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on pushes to main (not on PRs)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Create Firebase config
        run: |
          # Create firebase_options.dart from secrets
          echo "${{ secrets.FIREBASE_WEB_CONFIG }}" | base64 -d > lib/firebase_options.dart
          
          # Replace the helper class with proper import
          sed -i 's/class _FirebaseOptionsHelper {/\/\/ Replaced by CI\/CD - import firebase options/' lib/services/firebase_service.dart
          sed -i 's/static FirebaseOptions? get currentPlatform {/\/\/ Import DefaultFirebaseOptions from firebase_options.dart/' lib/services/firebase_service.dart
          sed -i 's/return null;/\/\/ Using DefaultFirebaseOptions.currentPlatform/' lib/services/firebase_service.dart
          sed -i 's/_FirebaseOptionsHelper.currentPlatform/DefaultFirebaseOptions.currentPlatform/' lib/services/firebase_service.dart
          
          # Add the proper import
          sed -i '12a import '\''../firebase_options.dart'\'';' lib/services/firebase_service.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web for GitHub Pages
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4