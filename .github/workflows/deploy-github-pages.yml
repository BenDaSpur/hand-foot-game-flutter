name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Test and validate (runs on all events)
  test:
    uses: ./.github/workflows/shared-quality-checks.yml
    with:
      setup_firebase_web: true
      flutter_version: "3.32.8"
    secrets: inherit

  # Deployment job
  deploy-pages:
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on pushes to main (not on PRs)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Firebase config (production for multiplayer)
        run: |
          echo "Using production Firebase configuration from secrets for multiplayer functionality"
          echo "${{ secrets.FIREBASE_WEB_CONFIG }}" | base64 -d > lib/firebase_options.dart
          if [[ ! -s lib/firebase_options.dart ]]; then
            echo "Error: Failed to write lib/firebase_options.dart from secret"
            echo "FIREBASE_WEB_CONFIG secret is required for GitHub Pages deployment with multiplayer"
            exit 1
          fi
          if ! grep -q "class DefaultFirebaseOptions" lib/firebase_options.dart; then
            echo "Error: Firebase config does not contain expected DefaultFirebaseOptions class"
            exit 1
          fi
          echo "Production Firebase configuration written and verified successfully"

      - name: Verify Firebase config
        run: |
          # Verify that firebase_options.dart exists and has the expected class
          if [[ ! -s lib/firebase_options.dart ]]; then
            echo "Error: Firebase config file lib/firebase_options.dart is missing"
            exit 1
          fi
          if ! grep -q "class DefaultFirebaseOptions" lib/firebase_options.dart; then
            echo "Error: Firebase config does not contain expected DefaultFirebaseOptions class"
            exit 1
          fi
          
          # Verify it's production config (not stub) for multiplayer functionality
          if grep -q "stub-project" lib/firebase_options.dart; then
            echo "Error: Found stub configuration instead of production - multiplayer will not work"
            exit 1
          else
            echo "Confirmed: Using production Firebase configuration (enables multiplayer)"
          fi
          echo "Production Firebase configuration verified successfully"

      - name: Install dependencies
        run: flutter pub get

      - name: Clean build cache
        run: |
          flutter clean
          echo "Build cache cleared"

      - name: Build Web for GitHub Pages with cache busting
        run: |
          # Build with unique version to prevent browser caching issues
          export BUILD_NUMBER=$(date +%s)
          flutter build web --release --base-href /${{ github.event.repository.name }}/ --dart-define=BUILD_NUMBER=$BUILD_NUMBER
          echo "Built with BUILD_NUMBER: $BUILD_NUMBER"
          
      - name: Add cache-busting headers
        run: |
          cd build/web
          # Backup original and apply changes safely
          cp index.html index.html.orig
          sed 's|<head>|<head>\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">|' index.html.orig > index.html
          # Verify the changes were applied
          if ! grep -q "Cache-Control" index.html; then
            echo "Error: Cache control headers not added properly"
            exit 1
          fi
          # Clean up backup file to avoid including in deployment
          rm index.html.orig
          # Add version comment for debugging
          echo "<!-- Deployed: $(date) -->" >> index.html
          echo "Cache-busting headers added and verified"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
