name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Test and validate (runs on all events)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze

  # Build job (only on PRs for validation)
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Setup Firebase config (production or stub)
        run: |
          if [[ -n "${{ secrets.FIREBASE_WEB_CONFIG }}" ]]; then
            echo "Using production Firebase configuration from secrets"
            echo "${{ secrets.FIREBASE_WEB_CONFIG }}" | base64 -d > lib/firebase_options.dart
            if [[ ! -s lib/firebase_options.dart ]]; then
              echo "Error: Failed to write lib/firebase_options.dart from secret"
              exit 1
            fi
            if ! grep -q "class DefaultFirebaseOptions" lib/firebase_options.dart; then
              echo "Error: Firebase config does not contain expected DefaultFirebaseOptions class"
              exit 1
            fi
            echo "Production Firebase configuration written and verified successfully"
          else
            echo "FIREBASE_WEB_CONFIG secret not found, using stub configuration"
            echo "This is acceptable for testing and development builds"
            # The app will automatically use the stub configuration from firebase_options_stub.dart
            # No action needed since our Firebase service already handles this case
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (validation only)
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

  # Deployment job (reusing working steps from build-and-release.yml)
  deploy-pages:
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on pushes to main (not on PRs)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Verify Firebase config
        run: |
          # Check if we have a production config or using stub
          if [[ -s lib/firebase_options.dart ]]; then
            echo "Verifying production Firebase configuration"
            if ! grep -q "class DefaultFirebaseOptions" lib/firebase_options.dart; then
              echo "Error: Firebase config does not contain expected DefaultFirebaseOptions class"
              exit 1
            fi
            echo "Production Firebase configuration verified successfully"
          else
            echo "Using stub Firebase configuration from firebase_options_stub.dart"
            if [[ ! -s lib/firebase_options_stub.dart ]]; then
              echo "Error: Stub Firebase config is missing"
              exit 1
            fi
            if ! grep -q "class DefaultFirebaseOptions" lib/firebase_options_stub.dart; then
              echo "Error: Stub Firebase config does not contain expected DefaultFirebaseOptions class"
              exit 1
            fi
            echo "Stub Firebase configuration verified successfully"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web for GitHub Pages
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
