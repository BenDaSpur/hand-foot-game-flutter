# Dependabot version updates for Dart/Flutter (pub) and GitHub Actions.
# Pub is a first-class ecosystem; no enable-beta-ecosystems flag is required.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dart-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Intentionally pinned in pubspec.yaml around broken FlutterFire
      # 6.7 / 6.5.5 / 12.4.4 releases. Remove these ignores when the pins lift.
      - dependency-name: "firebase_core"
      - dependency-name: "cloud_firestore"
      - dependency-name: "firebase_auth"
      - dependency-name: "firebase_analytics"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
